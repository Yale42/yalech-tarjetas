<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Página no encontrada · Tarjetas digitales de @yalech</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f5f0e8" />
  <!-- Ícono dentro del archivo: esta página puede abrirse desde cualquier carpeta -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230e0f10'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23f2a65a' stroke-width='1.5'/%3E%3Ctext x='32' y='40.5' text-anchor='middle' font-family='Arial' font-weight='700' font-size='22' fill='%23f5f0e8'%3EYG%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Página de error. El servidor (GitHub Pages, Netlify…) la muestra en cualquier dirección que
       no exista, aunque sea dentro de una carpeta. Por eso todo va aquí mismo: estilos, ícono y
       enlaces que se calculan solos (ver el script de abajo). -->
  <style>
    :root {
      --bg: #f5f0e8;
      --paper: #ebe4d8;
      --ink: #0e0f10;
      --muted: #6a645b;
      --amber: #f2a65a;
      --amber-text: #b45f17;
      --font: "Schibsted Grotesk", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    main { width: 100%; max-width: 520px; }

    /* 4 [celular] 4: el cero es un celular con la pantalla "cargando" */
    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-weight: 700;
      font-size: clamp(6rem, 30vw, 9.5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }
    .code > span { animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .code > span:last-child { animation-delay: 0.16s; }
    .phone {
      position: relative;
      flex: none;
      width: 0.58em;
      height: 1.08em;
      padding: 0.045em;
      border-radius: 0.11em;
      background: var(--ink);
      box-shadow: 0 24px 40px -18px rgba(14, 15, 16, 0.5);
      animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.08s both, tilt 4s ease-in-out 1.2s infinite alternate;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 0.075em;
      left: 50%;
      translate: -50% 0;
      width: 0.16em;
      height: 0.04em;
      border-radius: 99px;
      background: var(--ink);
      z-index: 1;
    }
    .screen {
      display: flex;
      flex-direction: column;
      gap: 0.04em;
      height: 100%;
      padding: 0.16em 0.06em 0.06em;
      border-radius: 0.075em;
      background: var(--bg);
      overflow: hidden;
    }
    /* Renglones de "página" que no termina de cargar */
    .screen i {
      display: block;
      height: 0.06em;
      border-radius: 0.02em;
      background: linear-gradient(90deg, var(--paper) 30%, #f7f2ea 50%, var(--paper) 70%) 0 0 / 300% 100%;
      animation: load 1.6s ease-in-out infinite;
    }
    .screen i:nth-child(1) { width: 60%; height: 0.1em; background-color: var(--amber); }
    .screen i:nth-child(2) { width: 90%; }
    .screen i:nth-child(3) { width: 75%; }
    .screen i:nth-child(4) { height: 0.22em; }
    .screen i:nth-child(5) { width: 85%; }
    .screen i:nth-child(6) { width: 50%; }
    @keyframes load { from { background-position: 100% 0; } to { background-position: 0 0; } }
    @keyframes tilt { from { rotate: -4deg; } to { rotate: 4deg; } }
    @keyframes rise { from { opacity: 0; translate: 0 24px; } }

    .kicker { margin-top: 30px; font-size: 0.85rem; font-weight: 600; color: var(--amber-text); }
    h1 {
      margin-top: 10px;
      font-weight: 700;
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(transparent 62%, rgba(242, 166, 90, 0.55) 62%) no-repeat 0 0 / 0% 100%;
      animation: mark 0.9s cubic-bezier(0.6, 0, 0.2, 1) 0.7s forwards;
    }
    @keyframes mark { to { background-size: 100% 100%; } }
    p.lead { margin: 14px auto 0; max-width: 38ch; font-size: 1.05rem; line-height: 1.55; color: var(--muted); }
    .kicker, h1, p.lead, .actions { animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    h1 { animation-delay: 0.08s; }
    p.lead { animation-delay: 0.16s; }
    .actions { animation-delay: 0.24s; }

    .actions { display: grid; gap: 10px; margin-top: 28px; }
    .btn {
      display: block;
      padding: 15px 20px;
      border: 1px solid var(--ink);
      border-radius: 12px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease, scale 0.2s ease;
    }
    .btn:hover { background: var(--ink); color: var(--bg); }
    .btn:active { scale: 0.97; }
    .btn--solid { background: var(--ink); color: var(--bg); }
    .btn--solid:hover { background: var(--amber); border-color: var(--amber); color: var(--ink); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sign { margin-top: 36px; font-size: 0.78rem; color: var(--muted); opacity: 0.7; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      h1 em { background-size: 100% 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">
      <span>4</span>
      <span class="phone"><span class="screen"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
      <span>4</span>
    </div>
    <p class="kicker">Error 404 · Página no encontrada</p>
    <h1>Esta página no existe. <em>Tu tarjeta sí puede.</em></h1>
    <p class="lead">Quizá el enlace cambió o tiene un error. Mientras tanto, mira las tarjetas de ejemplo.</p>
    <div class="actions">
      <a class="btn btn--solid" data-to="" href="/">Ver tarjetas</a>
      <div class="row">
        <a class="btn" href="https://yale42.github.io/yalech-web-link-in-bio/pages/yalech/">Ir a @yalech</a>
        <a class="btn" href="https://wa.me/520000000000?text=Hola%20Yael,%20encontr%C3%A9%20un%20enlace%20roto%20en%20tu%20p%C3%A1gina" target="_blank" rel="noopener">Avisarme</a>
      </div>
    </div>
    <p class="sign">Yael González · @yalech</p>
  </main>

  <script>
    // Calcula dónde vive el sitio para que los botones funcionen en cualquier carpeta.
    // En GitHub Pages de proyecto (usuario.github.io/repositorio/) la raíz es /repositorio/;
    // con dominio propio o en Netlify es /. Abierto como archivo, usa la carpeta de este 404.html.
    (() => {
      let base = '/';
      if (location.protocol === 'file:') base = location.pathname.replace(/[^/]*$/, '');
      else if (location.hostname.endsWith('github.io')) {
        const first = location.pathname.split('/')[1];
        if (first) base = '/' + first + '/';
      }
      document.querySelectorAll('[data-to]').forEach(a => { a.href = base + a.dataset.to; });
    })();
  </script>
</body>
</html>
